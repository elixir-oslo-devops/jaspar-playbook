- name: Systemd qcluster config
  tags:
    - jaspar
    - 15-django-q-cluster
  become: true
  ansible.builtin.template:
    src: django-q.service.j2
    dest: /etc/systemd/system/django-q.service
    mode: '0644'

- name: Enable qcluster service
  tags:
    - jaspar
    - 15-django-q-cluster
  become: true
  ansible.builtin.service:
    name: django-q
    enabled: true
    state: started

