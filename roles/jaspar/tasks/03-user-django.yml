- name: Build python path
  tags:
    - jaspar
    - 03-user-django
  ansible.builtin.command:
    cmd: '{{ jaspar_app_dir }}/deploy/tools/python_path'
  register: pythonpath

- name: Create a secret key
  tags:
    - jaspar
    - 03-user-django
  ansible.builtin.command:
    cmd: 'python {{ jaspar_app_dir }}/deploy/tools/make_secret.py'
  register: python_secret
  environment:
    PYTHONPATH: '{{ pythonpath.stdout }}'

- name: Write secret key to file
  tags:
    - jaspar
    - 03-user-django
  ansible.builtin.copy:
    content: "{{ python_secret.stdout }}"
    dest: '{{ jaspar_app_dir }}/secret.txt'
    owner: '{{ ansible_user }}'

- name: Migrate database for django-q
  tags:
    - jaspar
    - 03-user-django
  ansible.builtin.command:
    cmd: 'python {{ jaspar_app_dir }}/manage.py migrate django_q'
  environment:
    PYTHONPATH: '{{ pythonpath.stdout }}'

- name: Start django-q cluster
  tags:
    - jaspar
    - 03-user-django
  ansible.builtin.shell:
    cmd: |
      nohup python {{ jaspar_app_dir }}/manage.py qcluster &
      sleep 5
    chdir: '{{ jaspar_app_dir }}'
  environment:
    PYTHONPATH: '{{ pythonpath.stdout }}'

- name: Initialise static content
  tags:
    - jaspar
    - 03-user-django
  ansible.builtin.command:
    cmd: 'python {{ jaspar_app_dir }}/manage.py collectstatic --no-input'
  environment:
    PYTHONPATH: '{{ pythonpath.stdout }}'
